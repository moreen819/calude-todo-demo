<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e8ebf2;
  --accent:#2447f5; --accent-soft:#e8edff; --done:#12a15f; --danger:#d92d20;
  --shadow:0 1px 2px rgba(17,24,39,.04),0 24px 60px -20px rgba(36,71,245,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#0b0e17; --panel:#141926; --ink:#eef0f8; --muted:#8b93a7; --line:#232a3b;
  --accent:#7b93ff; --accent-soft:#1d2540; --done:#3ddc97; --danger:#ff6b60;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 24px 60px -20px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);display:flex;justify-content:center;padding:clamp(16px,6vw,72px) 16px;transition:background .25s,color .25s}
.app{width:100%;max-width:560px;background:var(--panel);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;align-self:flex-start}
header{padding:32px 32px 20px;position:relative}
.theme{position:absolute;top:24px;right:24px;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:color .2s,border-color .2s}
.theme:hover{color:var(--ink);border-color:var(--muted)}
.theme svg{width:18px;height:18px}
.day{font:600 clamp(2rem,7vw,2.75rem)/1.1 var(--serif);letter-spacing:-.02em}
.date{color:var(--muted);margin-top:4px}
.progress{display:flex;align-items:center;gap:14px;margin-top:22px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.3,.8,.3,1)}
.count{font-size:.875rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.add{display:flex;gap:10px;padding:0 32px 24px}
.add input{flex:1;min-width:0;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:inherit;transition:border-color .2s,box-shadow .2s}
.add input::placeholder{color:var(--muted)}
.add input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.add button{height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 .95rem var(--sans);cursor:pointer;transition:filter .2s,transform .1s}
[data-theme="dark"] .add button{color:#0b0e17}
.add button:hover{filter:brightness(1.08)}
.add button:active{transform:scale(.97)}
.tabs{display:flex;gap:4px;padding:0 32px;border-bottom:1px solid var(--line)}
.tab{padding:10px 14px;margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font:500 .9rem var(--sans);cursor:pointer;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
ul{list-style:none;padding:8px 16px;min-height:120px}
li{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;transition:background .15s}
li:hover{background:var(--bg)}
li.enter{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;transition:background .2s,border-color .2s}
.check svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:opacity .2s,transform .2s}
.check:hover{border-color:var(--accent)}
li.done .check{background:var(--done);border-color:var(--done)}
li.done .check svg{opacity:1;transform:none}
.label{flex:1;min-width:0;overflow-wrap:anywhere;cursor:text;transition:color .2s}
li.done .label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.edit{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:4px 10px;box-shadow:0 0 0 4px var(--accent-soft)}
.edit:focus{outline:none}
.del{flex:none;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .15s,color .15s,background .15s}
.del svg{width:16px;height:16px}
li:hover .del,.del:focus-visible{opacity:1}
.del:hover{color:var(--danger);background:var(--accent-soft)}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty strong{display:block;color:var(--ink);font:600 1.15rem var(--serif);margin-bottom:4px}
footer{display:flex;justify-content:space-between;align-items:center;padding:14px 32px 20px;border-top:1px solid var(--line);font-size:.875rem;color:var(--muted)}
.clear{border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;padding:4px 0;transition:color .2s}
.clear:hover:not(:disabled){color:var(--danger)}
.clear:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add input:focus-visible{outline:none}
@media (max-width:480px){header{padding:28px 20px 16px}.add,.tabs,footer{padding-left:20px;padding-right:20px}.del{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <button class="theme" id="theme" aria-label="Toggle dark mode"></button>
    <h1 class="day" id="day"></h1>
    <p class="date" id="date"></p>
    <div class="progress">
      <div class="bar" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
      <span class="count" id="count"></span>
    </div>
  </header>

  <div class="add">
    <input id="input" type="text" placeholder="Add a task" maxlength="200" autocomplete="off" aria-label="New task">
    <button id="addBtn" type="button">Add task</button>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-filter="all" aria-selected="true">All</button>
    <button class="tab" role="tab" data-filter="active" aria-selected="false">Active</button>
    <button class="tab" role="tab" data-filter="done" aria-selected="false">Completed</button>
  </div>

  <ul id="list" aria-live="polite"></ul>

  <footer>
    <span id="left"></span>
    <button class="clear" id="clear" type="button">Clear completed</button>
  </footer>
</main>

<script>
(function () {
  var KEY = 'tasks.v1', THEME_KEY = 'tasks.theme';
  var tasks = [], filter = 'all', justAdded = null;
  var $ = function (s) { return document.querySelector(s); };

  var ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };

  function load() {
    try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  /* Theme */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $('#theme').innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
  }
  var saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('#theme').addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  /* Header date */
  var now = new Date();
  $('#day').textContent = now.toLocaleDateString(undefined, { weekday: 'long' });
  $('#date').textContent = now.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });

  /* Actions */
  function addTask() {
    var input = $('#input'), text = input.value.trim();
    if (!text) { input.focus(); return; }
    var t = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text, done: false };
    tasks.unshift(t);
    justAdded = t.id;
    input.value = '';
    save(); render();
    input.focus();
  }
  function toggle(id) {
    tasks.forEach(function (t) { if (t.id === id) t.done = !t.done; });
    save(); render();
  }
  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save(); render();
  }
  function rename(id, text) {
    text = text.trim();
    if (!text) { remove(id); return; }
    tasks.forEach(function (t) { if (t.id === id) t.text = text; });
    save(); render();
  }

  function startEdit(li, t) {
    var label = li.querySelector('.label');
    var input = document.createElement('input');
    input.className = 'edit';
    input.value = t.text;
    input.maxLength = 200;
    input.setAttribute('aria-label', 'Edit task');
    label.replaceWith(input);
    input.focus();
    input.select();
    var finished = false;
    function finish(commit) {
      if (finished) return;
      finished = true;
      if (commit) rename(t.id, input.value); else render();
    }
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', function () { finish(true); });
  }

  /* Render */
  function makeItem(t) {
    var li = document.createElement('li');
    if (t.done) li.className = 'done';
    if (t.id === justAdded) li.classList.add('enter');

    var check = document.createElement('button');
    check.className = 'check';
    check.innerHTML = ICON.check;
    check.setAttribute('role', 'checkbox');
    check.setAttribute('aria-checked', String(t.done));
    check.setAttribute('aria-label', 'Mark "' + t.text + '" as ' + (t.done ? 'not done' : 'done'));
    check.addEventListener('click', function () { toggle(t.id); });

    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = t.text;
    label.title = 'Double-click to edit';
    label.addEventListener('dblclick', function () { startEdit(li, t); });

    var del = document.createElement('button');
    del.className = 'del';
    del.innerHTML = ICON.trash;
    del.setAttribute('aria-label', 'Delete "' + t.text + '"');
    del.addEventListener('click', function () { remove(t.id); });

    li.append(check, label, del);
    return li;
  }

  function render() {
    var list = $('#list');
    list.replaceChildren();

    var shown = tasks.filter(function (t) {
      return filter === 'all' || (filter === 'active' ? !t.done : t.done);
    });
    shown.forEach(function (t) { list.append(makeItem(t)); });
    justAdded = null;

    if (!shown.length) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.style.display = 'block';
      var msgs = {
        all: ['Nothing on your list', 'Add your first task above.'],
        active: ['All caught up', 'No active tasks right now.'],
        done: ['No completed tasks yet', 'Finished tasks will show up here.']
      }[filter];
      empty.innerHTML = '<strong></strong><span></span>';
      empty.firstChild.textContent = msgs[0];
      empty.lastChild.textContent = msgs[1];
      list.append(empty);
    }

    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.done; }).length;
    var left = total - done;
    var pct = total ? Math.round(done / total * 100) : 0;
    $('#fill').style.width = pct + '%';
    $('.bar').setAttribute('aria-valuenow', pct);
    $('#count').textContent = done + ' of ' + total + ' done';
    $('#left').textContent = left + (left === 1 ? ' task left' : ' tasks left');
    $('#clear').disabled = done === 0;
  }

  /* Events */
  $('#addBtn').addEventListener('click', addTask);
  $('#input').addEventListener('keydown', function (e) { if (e.key === 'Enter') addTask(); });
  $('#clear').addEventListener('click', function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save(); render();
  });
  $('#tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    filter = tab.dataset.filter;
    document.querySelectorAll('.tab').forEach(function (b) {
      b.setAttribute('aria-selected', String(b === tab));
    });
    render();
  });

  load();
  render();
})();
</script>
</body>
</html>
